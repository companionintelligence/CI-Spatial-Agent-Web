<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat App</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat&family=Open+Sans&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="agent-panel" id="agent-panel" style="display: none;">
            <!-- Agent panel content goes here -->
        </div>
        <div class="chat-history">
            <!-- More chat messages will appear here -->
        </div>
        <div class="chat-input">
            <textarea id="chat-input" placeholder="Type your message here..." onkeydown="handleKeyDown(event)"></textarea>
        </div>
        <div class="button-bar">
            <div class="left-buttons">
                <button onclick="toggleButton(this)"><img src="icons/microphone.svg" alt="Microphone" /></button>
                <button onclick="toggleButton(this)"><img src="icons/agent.svg" alt="Agent" /></button>
                <button onclick="toggleButton(this)"><img src="icons/barge-in.svg" alt="Barge-in" /></button>
                <button onclick="toggleButton(this)"><img src="icons/auto-submit.svg" alt="Auto-submit" /></button>
            </div>
            <div class="right-buttons">
                <button onclick="submitMessage()"><img src="icons/submit.svg" alt="Submit" /></button>
            </div>
        </div>
    </div>
<script>
    function handleKeyDown(event) {
        if (event.key === 'Enter' && !event.shiftKey && !event.altKey) {
            event.preventDefault();
            submitMessage();
        }
    }

    function submitMessage() {
        const input = document.getElementById('chat-input');
        const message = input.value.trim();
        if (message) {
            const chatHistory = document.querySelector('.chat-history');
            const newMessage = document.createElement('div');
            newMessage.className = 'chat-message user';
            newMessage.textContent = message;
            chatHistory.appendChild(newMessage);
            const responseMessage = document.createElement('div');
            responseMessage.className = 'chat-message participant';
            responseMessage.textContent = "I see your message";
            chatHistory.appendChild(responseMessage);
            input.value = '';
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }
    }
    function toggleButton(button) {
        button.classList.toggle('active');
        if (button === document.querySelector('.left-buttons button:nth-child(2)')) {
            const agentPanel = document.getElementById('agent-panel');
            if (button.classList.contains('active')) {
                agentPanel.style.display = 'block';
            } else {
                agentPanel.style.display = 'none';
            }
        }
    }
</script>
</html>
