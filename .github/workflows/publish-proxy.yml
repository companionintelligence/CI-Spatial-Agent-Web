name: Publish proxy container

# Builds the BFF sidecar image, smoke-tests /api/health, then pushes to GHCR.
# The marketplace manifest pins :latest.

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-proxy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/companionintelligence/ci-spatial-companion-proxy

jobs:
  publish:
    name: Build, smoke-test, publish proxy
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute tags
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          short="$(git rev-parse --short HEAD)"
          echo "sha_tag=${IMAGE_NAME}:sha-${short}" >> "$GITHUB_OUTPUT"
          tags="${IMAGE_NAME}:latest,${IMAGE_NAME}:sha-${short}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tags="${tags},${IMAGE_NAME}:${GITHUB_REF_NAME}"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      - name: Build image (load for testing)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/proxy/Dockerfile
          load: true
          tags: ${{ steps.meta.outputs.sha_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container
        run: docker run -d --name proxy -p 8787:8787 ${{ steps.meta.outputs.sha_tag }}

      - name: Smoke test /api/health
        run: |
          for i in $(seq 1 30); do
            body="$(curl -s http://localhost:8787/api/health || true)"
            if echo "$body" | grep -q '"status":"ok"'; then echo "healthy: $body"; exit 0; fi
            sleep 1
          done
          echo "proxy never became healthy"; docker logs proxy; exit 1

      - name: Tear down
        if: always()
        run: docker rm -f proxy || true

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin

      - name: Build and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/proxy/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
