name: Publish proxy container

# Builds the BFF sidecar image, smoke-tests /api/health, then pushes to GHCR.
# The marketplace manifest pins :latest.

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-proxy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/companionintelligence/ci-spatial-companion-proxy

jobs:
  publish:
    name: Build, smoke-test, publish proxy
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute tags
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          short="$(git rev-parse --short HEAD)"
          echo "sha_tag=${IMAGE_NAME}:sha-${short}" >> "$GITHUB_OUTPUT"
          tags="${IMAGE_NAME}:latest,${IMAGE_NAME}:sha-${short}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tags="${tags},${IMAGE_NAME}:${GITHUB_REF_NAME}"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"

      # Advisory only — a missing secret must never fail the publish. Without it
      # the build arg below expands to empty, the Dockerfile ARG default wins,
      # and we ship the same DSN-less image we always did.
      - name: Check Sentry DSN availability
        shell: bash
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          if [ -z "${SENTRY_DSN}" ]; then
            echo "::notice::SENTRY_DSN secret is not set — publishing a proxy image with no DSN compiled in. Error reporting stays inert (disabledReason: no-dsn)."
          else
            echo "SENTRY_DSN is set — baking it into the published proxy image."
          fi

      - name: Build image (load for testing)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/proxy/Dockerfile
          load: true
          tags: ${{ steps.meta.outputs.sha_tag }}
          build-args: |
            SENTRY_DSN=${{ secrets.SENTRY_DSN }}
            SENTRY_RELEASE=ci-spatial-companion-proxy@${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container
        # CI_TELEMETRY=off because the image now has a real DSN baked in and this
        # is a throwaway CI container: without it the health smoke test would file
        # any boot error into the production Sentry project.
        run: docker run -d --name proxy -e CI_TELEMETRY=off -p 8787:8787 ${{ steps.meta.outputs.sha_tag }}

      - name: Smoke test /api/health
        # This is an ephemeral container with no real Ollama/CosyVoice reachable
        # from the runner, so /api/health legitimately reports "degraded" (see
        # the "make connection health truthful" change — status reflects actual
        # upstream reachability, and routes.chat.test.ts itself asserts status
        # is one of 'ok' | 'degraded'). The smoke test only needs to confirm the
        # server booted and is serving valid health JSON, not that a chat
        # upstream is reachable from CI.
        run: |
          for i in $(seq 1 30); do
            body="$(curl -s http://localhost:8787/api/health || true)"
            if echo "$body" | grep -qE '"status":"(ok|degraded)"'; then echo "healthy: $body"; exit 0; fi
            sleep 1
          done
          echo "proxy never became healthy"; docker logs proxy; exit 1

      - name: Tear down
        if: always()
        run: docker rm -f proxy || true

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.repository_owner }}" --password-stdin

      - name: Build and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/proxy/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          # Server-side sidecar: SENTRY_DSN (no VITE_ prefix) becomes a runtime
          # ENV that instrument.ts reads at start-up. The web image is the
          # opposite case — see docker-publish.yml.
          build-args: |
            SENTRY_DSN=${{ secrets.SENTRY_DSN }}
            SENTRY_RELEASE=ci-spatial-companion-proxy@${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
