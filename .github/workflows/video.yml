# Product video — capture the real UI, then render both cuts.
#
# Deliberately NO `push` trigger. CI-Local-CICD's policy gates always-on
# workflows (its README: "CI-Marketplace was fully gated and billing again
# within a day"), so this runs on demand and once a week.
name: Product video

on:
  workflow_dispatch:
    inputs:
      render:
        description: Also render the MP4s (slower)
        type: boolean
        default: true
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

concurrency:
  group: video-${{ github.ref }}
  cancel-in-progress: true

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com

      - name: Install video project
        working-directory: video
        run: npm install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Chromium
        working-directory: video
        run: npx playwright install --with-deps chromium

      # This repo is pnpm (pnpm-workspace.yaml, pnpm-lock.yaml, packageManager
      # pnpm@10.28.2). Its generated CLAUDE.md/AGENTS.md still say "npm" — that is
      # a stale template, not the truth.
      - name: Enable pnpm
        run: corepack enable

      # Boots the capture stage with the SAME command and port the repo's own
      # capture harness already uses, so there is only one way to stand this app
      # up: playwright.config.capture.ts `webServer.command` is
      # `PORT=5178 pnpm --filter @ci-avatar/web dev`, with CAPTURE_PORT defaulting
      # to 5178 ("5173 is frequently occupied"). video/capture.config.mjs points at
      # the same port. That config also sets `reuseExistingServer: true`, so the
      # L4/L5 suites can share this server rather than spawning a second one.
      #
      # COST: `predev` runs scripts/pack-assets.mjs, which copies ~210 MB of
      # avatars/animations/props from /assets into apps/web/public/assets
      # (gitignored, regenerated every time). Budget the minutes and the disk —
      # that copy, not vite, is what makes first boot slow.
      #
      # Node: setup-node above pins 22 because the video kit needs >=22. The app
      # declares engines >=20 (.node-version says 20) and runs fine on 22.
      - name: Start app
        run: |
          pnpm install --frozen-lockfile
          nohup env PORT=5178 pnpm --filter @ci-avatar/web dev \
            > /tmp/spatial-companion-dev.log 2>&1 &
          disown
          echo "waiting for http://localhost:5178 (pack-assets copies ~210 MB first)"
          up=""
          for _ in $(seq 1 150); do
            if curl -sfo /dev/null http://localhost:5178/; then up=yes; break; fi
            sleep 2
          done
          if [ -z "$up" ]; then
            echo "::error::app stage did not come up on :5178 within 300s"
            tail -n 200 /tmp/spatial-companion-dev.log
            exit 1
          fi
          echo "stage is up"

      - name: Capture
        working-directory: video
        run: npm run capture

      # Shots are byte-stable, so a diff here means the UI genuinely changed.
      # Surface it as a PR rather than silently committing to the branch.
      #
      # CAVEAT FOR THIS REPO: they are NOT byte-stable. Every shot contains a live
      # WebGL avatar whose animation loop never stops (Scene3D keeps frameloop
      # "always" on purpose), and video/capture.config.mjs deliberately does not
      # mask the canvas because the avatar IS the product. Expect this step to
      # report drift on most runs; treat the PR it opens as "look at the images",
      # not as evidence the UI changed.
      - name: Detect UI drift
        id: drift
        working-directory: video
        run: |
          if [ -n "$(git status --porcelain assets/shots)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --porcelain assets/shots
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and check
        working-directory: video
        run: npm run build && npm run check

      - name: Render
        if: ${{ github.event_name == 'schedule' || inputs.render }}
        working-directory: video
        run: npm run render

      - uses: actions/upload-artifact@v4
        with:
          name: ci-spatial-companion-webxr-video
          path: |
            video/out/*.mp4
            video/assets/shots/*.png
          if-no-files-found: warn

      - name: Open a PR when the UI drifted
        if: steps.drift.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/video-shot-refresh
          title: "chore(video): refresh Spatial Companion product-video captures"
          body: |
            The scheduled capture produced different screenshots, which means the UI changed.

            Review the image diff, update `video/storyboard.json` captions if a screen's meaning
            changed, then merge to re-render the product video from the current UI.
          add-paths: video/assets/shots
          commit-message: "chore(video): refresh product-video captures"
