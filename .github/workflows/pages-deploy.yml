name: Deploy Web App to Cloudflare Pages

on:
  push:
    branches:
      - main
  # Lets the custom-domain step be run on demand after provisioning the secrets,
  # without waiting for the next push to main.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # Public hostname this app is served from. The Pages project keeps its own
  # *.pages.dev name as well; this is the one people are given.
  PAGES_CUSTOM_DOMAIN: avatar.ci.computer

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Mirrors test.yml's setup, which is the one proven to work under this org's
      # Actions policy. (pnpm/action-setup is on the org allowlist; see the deploy
      # step below for the action that is not.)
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # CF_PAGES makes scripts/pages-poststrip.mjs drop the one >25 MiB asset that
      # Pages refuses, matching what a dashboard-triggered Pages build does.
      #
      # The APP_* variables are read by scripts/pages-config.mjs, which writes
      # dist/config.json. That file is the only thing pointing this static deploy at
      # a backend: the Pages origin serves no /api, so APP_PROXY_URL must be the
      # ABSOLUTE URL of the self-hosted proxy behind its Cloudflare tunnel. Set
      # them as repository variables (not secrets — they end up in a public file).
      - name: Build Web App
        env:
          CF_PAGES: '1'
          APP_LLM_PROVIDER: ${{ vars.APP_LLM_PROVIDER }}
          APP_PROXY_URL: ${{ vars.APP_PROXY_URL }}
          APP_LLM_MODEL: ${{ vars.APP_LLM_MODEL }}
          APP_OLLAMA_URL: ${{ vars.APP_OLLAMA_URL }}
          APP_TTS_MODE: ${{ vars.APP_TTS_MODE }}
          APP_TTS_VOICE: ${{ vars.APP_TTS_VOICE }}
          APP_STT_REMOTE: ${{ vars.APP_STT_REMOTE }}
        run: pnpm --filter @ci-avatar/web build

      # Skip deploy instead of failing when the Cloudflare secrets aren't
      # configured. The build itself still runs and still verifies the app
      # compiles; only the deploy is conditional.
      #
      # NB: an earlier version of this comment blamed the workflow's long run of
      # failures on these missing secrets. That was wrong, and the check below
      # could never have fixed them: the job died at "Prepare all required
      # actions", before any step executed, because this org's Actions policy
      # does not allow `cloudflare/pages-action` —
      #
      #   Unable to resolve actions. Cannot access repositories
      #   'cloudflare/pages-action'.
      #
      # which is why every one of those runs failed in about seven seconds. The
      # deploy step below now calls the wrangler CLI over npx instead of using a
      # third-party action, so there is nothing left for the policy to block.
      - name: Check for Cloudflare secrets
        id: secrets
        run: |
          if [ -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" ] && [ -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" ] && [ -n "${{ secrets.CLOUDFLARE_PAGES_PROJECT }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Cloudflare Pages secrets are not configured (CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID / CLOUDFLARE_PAGES_PROJECT) — skipping deploy. Provision the secrets to enable it, or remove this workflow if this deploy target is no longer wanted."
          fi

      # The wrangler CLI over npx, rather than `cloudflare/pages-action` (blocked by
      # this org's Actions policy — see above) or `cloudflare/wrangler-action`
      # (third-party too, so it would be blocked the same way). wrangler reads
      # CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID from the environment.
      #
      # --commit-dirty=true because the checkout has build output in it by this
      # point; without it wrangler declines to attach the commit metadata.
      #
      # --branch is the ref this run is on, NOT a hardcoded "main". Cloudflare
      # decides production vs preview from that name: the project's production
      # branch deploys to production, anything else becomes a preview. Since this
      # workflow also has a workflow_dispatch trigger, hardcoding "main" would mean
      # a dispatch from any branch publishes that branch straight to the production
      # hostname. GITHUB_REF_NAME keeps the push-to-main path a production deploy
      # (identical behaviour) while making a dispatch from a branch a preview.
      - name: Deploy to Cloudflare Pages
        if: steps.secrets.outputs.present == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PAGES_PROJECT: ${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          npx --yes wrangler@4 pages deploy apps/web/dist \
            --project-name="$PAGES_PROJECT" \
            --branch="$GITHUB_REF_NAME" \
            --commit-hash="$GITHUB_SHA" \
            --commit-dirty=true

      # Idempotent: attaches the custom domain to the Pages project and points the
      # zone's CNAME at it, or reports that both already match and changes nothing.
      # Runs after the deploy because a project with no deployment has no
      # *.pages.dev subdomain to CNAME to yet.
      #
      # continue-on-error because the DNS half needs Zone:DNS:Edit and Zone:Read on
      # top of the Pages permission the deploy uses. A token with only the Pages
      # scope should not turn a good deploy red — the *.pages.dev URL is live either
      # way, and the step's log says exactly what was missing.
      # Restricted to main: the custom domain is a production-level binding on the
      # Pages project, so a workflow_dispatch from a feature branch has no business
      # attaching or repointing it. On a branch the deploy above still runs and
      # produces a preview URL, which is what a dispatch is useful for.
      - name: Ensure custom domain
        if: steps.secrets.outputs.present == 'true' && github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Passed as env rather than interpolated into the script body, so the value
          # is never parsed as shell.
          PAGES_PROJECT: ${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          node scripts/cloudflare-domain.mjs \
            --project "$PAGES_PROJECT" \
            --domain "$PAGES_CUSTOM_DOMAIN"
