name: Test

# Unit/component tests (vitest) + Storybook build smoke + typecheck.
# Separate from the container-publish workflow; that one remains the deploy gate.

# >>> ci-local:gated original triggers below, restore with `ci-local restore`
# on:
#   push:
#     branches: [main]
#   pull_request:
#     branches: [main]
#   workflow_dispatch:
# <<< ci-local:gated
on:
  workflow_dispatch:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: vitest + storybook + typecheck
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit + component tests
        run: pnpm test

      - name: Typecheck + build web
        run: pnpm --filter @ci-avatar/web build

      - name: Build Storybook (smoke)
        run: pnpm build-storybook
