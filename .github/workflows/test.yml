name: Test

# Lint (eslint) + unit/component tests (vitest) + Storybook build smoke + typecheck.
# Separate from the container-publish workflow; that one remains the deploy gate.

# >>> ci-local:gated original triggers below, restore with `ci-local restore`
# on:
#   push:
#     branches: [main]
#   pull_request:
#     branches: [main]
#   workflow_dispatch:
# <<< ci-local:gated
on:
  workflow_dispatch:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + vitest + storybook + typecheck
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Runs `eslint .` in each of the four workspace projects against the flat
      # config at the repo root. Cheap, so it goes first and fails fast.
      - name: Lint
        run: pnpm lint

      - name: Unit + component tests
        run: pnpm test

      - name: Typecheck + build web
        run: pnpm --filter @ci-avatar/web build

      # The build above runs with VITE_SENTRY_DSN unset, so the whole telemetry
      # path must fold to dead code and the Sentry SDK must be tree-shaken out.
      # This is a real regression risk, not a theoretical one: writing the DSN as
      # `import.meta.env.X?.trim()` instead of a bare module-scope const stops it
      # folding under rolldown and silently ships ~90 kB of SDK — plus a reporting
      # path — in a build that is supposed to have none.
      - name: Assert no Sentry SDK in the DSN-less bundle
        run: |
          if grep -rlE "captureException|ingest\.sentry\.io" apps/web/dist --include="*.js"; then
            echo "::error::VITE_SENTRY_DSN is unset but the Sentry SDK is still in the bundle."
            echo "Check the module-scope 'const DSN = import.meta.env.VITE_SENTRY_DSN' shape in apps/web/src/lib/telemetry.ts (no optional chaining)."
            exit 1
          fi
          echo "OK — no Sentry SDK in the DSN-less bundle"

      - name: Build Storybook (smoke)
        run: pnpm build-storybook
