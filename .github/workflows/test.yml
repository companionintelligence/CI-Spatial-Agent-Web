name: Test

# Lint (eslint) + unit/component tests (vitest) + Storybook build smoke + typecheck.
# Separate from the container-publish workflow; that one remains the deploy gate.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint + vitest + storybook + typecheck
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Runs `eslint .` in each of the four workspace projects against the flat
      # config at the repo root. Cheap, so it goes first and fails fast.
      - name: Lint
        run: pnpm lint

      - name: Unit + component tests
        run: pnpm test

      - name: Typecheck + build web
        run: pnpm --filter @ci-avatar/web build

      - name: Build Storybook (smoke)
        run: pnpm build-storybook
