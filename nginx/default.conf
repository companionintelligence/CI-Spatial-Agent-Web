# Serve the built SPA on the Hub internalPort (5173) with history-API fallback.
server {
    listen       5173;
    server_name  _;
    root   /usr/share/nginx/html;
    index  index.html;

    # Runtime config, regenerated from env on container start — never cache it.
    location = /config.json {
        try_files $uri =404;
        add_header Cache-Control "no-store";
        default_type application/json;
    }

    # The service worker script is checked for changes on every page load; keep a shared
    # cache from holding a stale copy (the same rule public/_headers has for the Pages deploy).
    location = /sw.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # Stock nginx's mime.types has no entry for .webmanifest, so the manifest would go out as
    # application/octet-stream (Pages sends application/manifest+json on its own). default_type
    # applies only to an extension the table does not know; a `types {}` block here would
    # replace the whole inherited table.
    location = /manifest.webmanifest {
        try_files $uri =404;
        default_type application/manifest+json;
    }

    # Backend proxy (BFF): stream chat to the server-configured upstream. Buffering
    # MUST be off or SSE is delivered all at once, breaking the TTS breath cadence.
    # The upstream is resolved lazily via a variable + Docker's embedded DNS so nginx
    # still starts (and /api just 502s) when the proxy sidecar isn't present.
    #
    # This single prefix block covers ALL BFF endpoints — /api/chat, /api/health,
    # and the streaming /api/tts audio route — so no per-route location is needed;
    # `proxy_buffering off` is what lets /api/tts audio chunks arrive incrementally.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $bff_upstream "http://proxy:8787";
        proxy_pass $bff_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # Hashed build assets — cache hard.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA routes fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
