<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Layout</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        header, main, footer {
            border: 3px solid #000;
            margin: 10px 0;
            padding: 10px;
        }
        main {
            display: flex;
            flex-direction: column;
        }
        .agent, .history {
            border: 3px solid #000;
            margin: 10px 0;
            padding: 10px;
        }
        @media (min-width: 768px) {
            main {
                flex-direction: row;
            }
            .agent, .history {
                flex: 1;
                margin: 10px;
            }
            .container {
                display: flex;
                flex-direction: column;
            }
        }
        section {
            border: 3px solid #000;
            margin: 10px;
            padding: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Header Section</h1>
            <p>This is the header section.</p>
        </header>
        <main>
            <div class="history">
                <h2>History Section</h2>
                <p>This is the history section.</p>
            </div>
            <div class="agent">
                <h2>Agent Section</h2>
                <p>This is the agent section.</p>
            </div>
        </main>
        <footer>
            <h1>Chat Input Dialog</h1>
            <input type="text" placeholder="Type your message here..." style="width: 100%; padding: 10px;">
        </footer>
    </div>
</body>
</html>
