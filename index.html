<!doctype html>
<html lang="en">
<head>
<title>Companion Intelligence</title>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script type="importmap">
{
"imports": {
"three": "https://unpkg.com/three@0.148.0/build/three.module.js",
"three/addons/": "https://unpkg.com/three@0.148.0/examples/jsm/",
"orbital/": "./shared/",
"assets/": "./assets/",
"here/": "./"
}
}
</script>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.2/dist/ort.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@ricky0123/vad-web@0.0.19/dist/bundle.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Montserrat&family=Open+Sans&display=swap" rel="stylesheet">        
<link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <br/>
        <img style="width:200px" src="assets/2024_CI__Logo_Banner_Color.svg"/>
        <br/>
        <canvas class="microphone-panel" id="microphone-panel" style="display: none;"></canvas>
        <div class="agent-panel" id="volume001" styxle="display:none"></div>
        <div class="chat-history"></div>
        <div class="resizer"></div>
            <!-- More chat messages will appear here -->
        </div>
        <div class="chat-input">
            <textarea id="chat-input" placeholder="Type your message here..." onkeydown="handleKeyDown(event)"></textarea>
        </div>
        <div class="button-bar">
            <div class="left-buttons">
                <button onclick="toggleButton(this)"><img src="icons/microphone.svg" alt="Microphone" /></button>
                <button onclick="toggleButton(this)"><img src="icons/agent.svg" alt="Agent" /></button>
                <button onclick="toggleButton(this)"><img src="icons/barge-in.svg" alt="Barge-in" /></button>
                <button onclick="toggleButton(this)"><img src="icons/auto-submit.svg" alt="Auto-submit" /></button>
            </div>
            <div class="right-buttons">
                <button onclick="submitMessage()"><img src="icons/submit.svg" alt="Submit" /></button>
            </div>
        </div>
    </div>
</html>

<script src="chat.js"></script>

<script src="audio3.js" type="module"></script>

<script src="index.js" type="module"></script>
