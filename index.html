<!doctype html>
<html lang="en">
<head>
<title>Companion Intelligence</title>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script type="importmap">
{
"imports": {
"three": "https://unpkg.com/three@0.148.0/build/three.module.js",
"three/addons/": "https://unpkg.com/three@0.148.0/examples/jsm/",
"orbital/": "./shared/",
"assets/": "./assets/",
"here/": "./"
}
}
</script>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.19.2/dist/ort.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@ricky0123/vad-web@0.0.19/dist/bundle.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Montserrat&family=Open+Sans&display=swap" rel="stylesheet">        
<link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">
        <header>
            <img style="width:200px" src="assets/2024_CI__Logo_Banner_Color.svg" alt="Logo"/>
        </header>
        <main>
            <div class="conversations">
                <div class="chat-history"></div>
            </div>
            <div class="puppetry">
                <div class="agent-panel" id="volume001" style="border-radius:5px;overflow:hidden;display:none;position:absolute;left:0;top:0;height:100%;width:100%;"></div>
            </div>
        </main>
        <footer>
            <div class="conversations">
                <canvas class="microphone-panel" id="microphone-panel" style="display: none;"></canvas>
                <div class="chat-input">
                    <textarea id="chat-input" placeholder="Type your message here..."></textarea>
                </div>
                <div class="button-bar">
                    <div class="left-buttons">
                        <button id="button-microphone"><img src="icons/microphone.svg" alt="Microphone" /></button>
                        <button id="button-agent"><img src="icons/agent.svg" alt="Agent" /></button>
                        <button id="button-barge"><img src="icons/barge-in.svg" alt="Barge-in" /></button>
                        <button id="button-auto"><img src="icons/auto-submit.svg" alt="Auto-submit" /></button>
                    </div>
                    <div class="right-buttons">
                        <button id="button-submit"><img src="icons/submit.svg" alt="Submit" /></button>
                    </div>
                </div>
                <br/>
                <br/>
            </div>
            <div class="puppetry"></div>
        </footer>
    </div>
</body>
</html>

<script src="index.js" type="module"></script>

<script src="audio3.js" type="module"></script>
